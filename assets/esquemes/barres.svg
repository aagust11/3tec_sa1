<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img"><title>Mènsula triangular: compressió i tracció</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#b45309"/></marker><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e5e7eb" stroke-width=".6"/></pattern></defs><rect width="100%" height="100%" rx="14" fill="#fafaf8"/><rect x="15" y="15" width="970" height="370" rx="12" fill="url(#grid)"/><g font-family="Arial,sans-serif"><rect x="65" y="45" width="28" height="260" fill="#cfd3d8"/><path d="M95 70V250H335Z" fill="none" stroke="#343a40" stroke-width="7"/><path d="M335 250L335 330" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="355" y="318" font-size="18" fill="#343a40">Càrrega</text><text x="110" y="286" font-size="17" fill="#343a40">AC: 120 mm · compressió</text><text x="143" y="124" font-size="17" fill="#343a40">BC: 150 mm</text><text x="158" y="150" font-size="17" fill="#b45309">tracció</text><text x="22" y="170" font-size="17" fill="#343a40">90</text><text x="73" y="65" font-size="20" fill="#343a40">B</text><text x="72" y="270" font-size="20" fill="#343a40">A</text><text x="340" y="245" font-size="20" fill="#343a40">C</text><text x="510" y="90" font-size="24" fill="#343a40">Muntatge de referència</text><text x="510" y="145" font-size="18" fill="#343a40">A i B: punts fixats al suport</text><text x="510" y="185" font-size="18" fill="#343a40">C: extrem on pengem la càrrega</text><text x="510" y="225" font-size="18" fill="#343a40">BC estira C cap amunt i a l’esquerra</text><text x="510" y="265" font-size="18" fill="#343a40">AC empeny C cap a la dreta</text><text x="510" y="320" font-size="17" fill="#b45309">Amb la diagonal sota C, els papers canvien.</text></g></svg>