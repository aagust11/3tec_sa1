<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img"><title>Elements d’un edifici entramat</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#b45309"/></marker><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e5e7eb" stroke-width=".6"/></pattern></defs><rect width="100%" height="100%" rx="14" fill="#fafaf8"/><rect x="15" y="15" width="970" height="370" rx="12" fill="url(#grid)"/><g font-family="Arial,sans-serif"><g fill="#dce1e5" stroke="#343a40" stroke-width="3"><rect x="165" y="80" width="28" height="225"/><rect x="420" y="80" width="28" height="225"/><rect x="145" y="70" width="320" height="25"/><rect x="145" y="180" width="320" height="25"/><rect x="130" y="305" width="105" height="45"/><rect x="385" y="305" width="105" height="45"/></g><path d="M95 355L560 355" stroke="#6b7280" stroke-width="3" fill="none"/><path d="M310 30L310 65" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M310 100L310 170" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M206 220L206 298" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M400 220L400 298" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="600" y="80" font-size="18" fill="#343a40">Forjat i bigues: recullen les càrregues</text><text x="600" y="130" font-size="18" fill="#343a40">Pilars: les condueixen cap avall</text><text x="600" y="180" font-size="18" fill="#343a40">Sabates: les reparteixen al terreny</text><text x="600" y="270" font-size="23" fill="#b45309">Un camí de càrregues continu</text><text x="600" y="305" font-size="16" fill="#343a40">No totes les parets són portants.</text></g></svg>