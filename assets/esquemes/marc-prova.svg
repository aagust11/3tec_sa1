<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img"><title>Marc articulat amb barra o cable diagonal</title><rect width="1000" height="440" fill="#fafbfc"/><g font-family="Arial,sans-serif" font-size="18" fill="#29323a"><text x="35" y="40" font-weight="bold">1. Sense diagonal</text><text x="365" y="40" font-weight="bold">2. Barra rígida</text><text x="690" y="40" font-weight="bold">3. Cable</text><g transform="translate(20 90)"><path d="M20 20H220V220H20Z" stroke="#596e7e" fill="none" stroke-width="10"/><circle cx="20" cy="20" r="8" fill="white" stroke="#29323a"/><circle cx="220" cy="20" r="8" fill="white" stroke="#29323a"/><circle cx="220" cy="220" r="8" fill="white" stroke="#29323a"/><circle cx="20" cy="220" r="8" fill="white" stroke="#29323a"/></g><g transform="translate(350 90)"><path d="M20 20H220V220H20Z" stroke="#596e7e" fill="none" stroke-width="10"/><path d="M20 220L220 20" stroke="#b45309" stroke-width="9"/><circle cx="20" cy="20" r="8" fill="white" stroke="#29323a"/><circle cx="220" cy="20" r="8" fill="white" stroke="#29323a"/><circle cx="220" cy="220" r="8" fill="white" stroke="#29323a"/><circle cx="20" cy="220" r="8" fill="white" stroke="#29323a"/></g><g transform="translate(680 90)"><path d="M20 20H220V220H20Z" stroke="#596e7e" fill="none" stroke-width="10"/><path d="M20 220L220 20" stroke="#b45309" stroke-width="3"/><circle cx="20" cy="20" r="8" fill="white" stroke="#29323a"/><circle cx="220" cy="20" r="8" fill="white" stroke="#29323a"/><circle cx="220" cy="220" r="8" fill="white" stroke="#29323a"/><circle cx="20" cy="220" r="8" fill="white" stroke="#29323a"/></g><text x="35" y="355">Unions que poden girar</text><text x="365" y="355">Pot estirar i empènyer</text><text x="690" y="355">Només pot estirar</text><text x="35" y="407">Fixa la base. Compara els dos sentits de moviment sense forçar ni trencar les unions.</text></g></svg>
