<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img"><title>Vinclament d’una barra esvelta</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#b45309"/></marker><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e5e7eb" stroke-width=".6"/></pattern></defs><rect width="100%" height="100%" rx="14" fill="#fafaf8"/><rect x="15" y="15" width="970" height="370" rx="12" fill="url(#grid)"/><g font-family="Arial,sans-serif"><path d="M160 290V90M480 290Q590 190 480 90" stroke="#343a40" stroke-width="8" fill="none"/><path d="M160 35L160 80" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M480 35L480 80" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="85" y="350" font-size="18" fill="#343a40">Abans: barra recta</text><text x="400" y="350" font-size="18" fill="#343a40">Després: desviació lateral</text><text x="670" y="130" font-size="23" fill="#343a40">Causa: compressió</text><text x="670" y="185" font-size="18" fill="#343a40">Hi influeixen la longitud,</text><text x="670" y="220" font-size="18" fill="#343a40">la secció i els recolzaments.</text><text x="670" y="280" font-size="18" fill="#b45309">No és un sisè esforç bàsic.</text></g></svg>