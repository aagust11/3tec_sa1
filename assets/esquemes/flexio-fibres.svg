<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img"><title>Flexió: zona comprimida i zona traccionada</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#b45309"/></marker><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e5e7eb" stroke-width=".6"/></pattern></defs><rect width="100%" height="100%" rx="14" fill="#fafaf8"/><rect x="15" y="15" width="970" height="370" rx="12" fill="url(#grid)"/><g font-family="Arial,sans-serif"><path d="M90 150Q340 245 590 150" fill="none" stroke="#343a40" stroke-width="13"/><path d="M90 180Q340 275 590 180" fill="none" stroke="#b45309" stroke-width="13"/><path d="M90 165Q340 260 590 165" fill="none" stroke="#a1a6ac" stroke-dasharray="6 5" stroke-width="2"/><path d="M340 45L340 180" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M70 220L90 188 110 220ZM570 220L590 188 610 220Z" fill="#6b7280"/><text x="680" y="125" font-size="18" fill="#343a40">Part superior: compressió</text><text x="680" y="180" font-size="19" fill="#b45309">Part inferior: tracció</text><text x="680" y="235" font-size="18" fill="#343a40">Zona neutra entre les dues</text><text x="95" y="325" font-size="18" fill="#343a40">Cas mostrat: biga recolzada als extrems, càrrega central cap avall.</text></g></svg>