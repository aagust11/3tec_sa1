<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
<title id="title">Un regle, dues orientacions</title><desc id="desc">Dos muntatges amb el mateix regle, suports i càrrega central. El perfil pla és ample i baix; de cantell és estret i alt. La deformació del primer és més gran. Dibuix qualitatiu.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad490b"/></marker></defs>
<rect width="800" height="620" rx="18" fill="#f4f5f6"/>
<g font-family="Arial,sans-serif" fill="#262d33">
<text x="28" y="40" font-size="25" font-weight="bold">Mateix regle · mateix pes · mateixos suports</text>
<rect x="20" y="60" width="760" height="250" rx="12" fill="white" stroke="#d7dadd"/>
<text x="40" y="93" font-size="24" font-weight="bold">1. Regle pla</text>
<path d="M80 200H540" stroke="#92999d" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M80 200Q310 310 540 200" fill="none" stroke="#ad490b" stroke-width="9"/>
<path d="M63 232L80 204L97 232ZM523 232L540 204L557 232Z" fill="#52616d"/>
<path d="M310 113V241" stroke="#ad490b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="330" y="145" font-size="19">Càrrega</text>
<path d="M320 200H400M320 255H400M390 200V255" stroke="#52616d" fill="none" stroke-width="2"/>
<text x="405" y="233" font-size="23">δ</text>
<text x="590" y="128" font-size="19">Secció frontal</text>
<rect x="610" y="177" width="120" height="16" fill="#ffcc91" stroke="#ad490b" stroke-width="2"/>
<text x="600" y="225" font-size="18">Ample i baix</text>
<text x="40" y="287" font-size="18">La cara ampla queda horitzontal.</text>
<rect x="20" y="325" width="760" height="250" rx="12" fill="white" stroke="#d7dadd"/>
<text x="40" y="358" font-size="24" font-weight="bold">2. Regle de cantell</text>
<path d="M80 465H540" stroke="#92999d" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M80 465Q310 493 540 465" fill="none" stroke="#ad490b" stroke-width="9"/>
<path d="M63 497L80 469L97 497ZM523 497L540 469L557 497Z" fill="#52616d"/>
<path d="M310 378V465" stroke="#ad490b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="330" y="410" font-size="19">Mateixa càrrega</text>
<path d="M320 465H400M320 479H400M390 465V479" stroke="#52616d" fill="none" stroke-width="2"/>
<text x="405" y="485" font-size="23">δ</text>
<text x="590" y="393" font-size="19">Secció frontal</text>
<rect x="662" y="409" width="16" height="120" fill="#ffcc91" stroke="#ad490b" stroke-width="2"/>
<text x="600" y="553" font-size="18">Estret i alt</text>
<text x="40" y="552" font-size="18">Gira el regle 90°: cara ampla vertical.</text>
<text x="28" y="603" font-size="17">δ = baixada del centre. Esquema qualitatiu: deformacions sense escala.</text>
</g></svg>
