name: Valida continguts i interaccions
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm install --no-save --ignore-scripts playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-validacio
          path: test-output/
          retention-days: 7
